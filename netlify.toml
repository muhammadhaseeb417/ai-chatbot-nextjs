[build]
  command = "npm run build"
  publish = ".next"

# Redirect for Next.js SPA deployment
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  # Increase timeout (Netlify now requires object syntax)
  [functions.timeout]
    duration = 10

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
